<!DOCTYPE html>
<html lang="de-DE">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tim Tepaße</title>

  <style>
    * {
      box-sizing: border-box;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      font-weight: 200;

      padding: 0;
      margin: 0;

      color: rebeccapurple;

      /* outline: 1px solid red; */
    }


    body {
      background-color: slategray;
      background-image: url(noise.svg);

      height: 100vh;

      display: grid;
      grid-template:
        "empty empty empty" auto
        "empty empty empty" auto
        "empty empty element" min-content
        \  auto auto min-content;
    }

    @media screen and (width < 50rem) {
      :root {
        font-size: 0.6rem;
      }

      body {
        grid-template:
          "empty" auto
          "empty" auto
          "element" min-content
          "empty" auto;
      }
    }

    main {
      grid-area: element;
      /* justify-self: center; */

      display: grid;
      grid-template:
        "name name"
        "city mail"
        "github linkedin";
      align-content: space-between;
      column-gap: 4rem;


      margin: auto auto auto 0;
      padding: 1rem 2rem;

      rotate: -4deg;

      background-color: white;
      border-radius: 1rem;
      box-shadow: rgba(8, 16, 29, 0.3) 1rem 1rem 1rem 1rem;

    }

    #name {
      grid-area: name;
      padding: 1rem;
      font-size: 5rem;
    }

    p {
      padding: 0.5em;
      font-size: 1.5rem;
      text-align: left;
    }


    #city {
      grid-area: city;
    }

    #mail {
      grid-area: mail;
    }

    a:link,
    a:visited {
      text-decoration: none;
    }

    a:hover,
    a:active {
      text-decoration: underline;
    }
  </style>

</head>

<body>
  <main>
    <h1 id="name">Tim Tepaße</h1>
    <p id="city">Dortmund</p>
    <p id="mail"><a href="mailto:hallo@timtepasse.de">hallo@timtepasse.de</a></p>
    <p id="github"><a href="https://github.com/ttepasse/">Github</a></p>
    <p id="linked"><a href="www.linkedin.com/in/ttepasse">LinkedIn</a></p>
  </main>
</body>

</html>
